<svg width="360" height="700" viewBox="0 0 360 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <symbol id="icon-warning4" viewBox="0 0 24 24">
      <path d="M12 3 L21 19 H3 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="12" y1="9.2" x2="12" y2="13.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="12" cy="16.3" r="1" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="icon-bell4" viewBox="0 0 24 24">
      <path d="M12 2a5 5 0 0 0-5 5v3.1c0 .9-.4 1.8-1 2.4L4.8 14h14.4l-1.2-1.5c-.6-.6-1-1.5-1-2.4V7a5 5 0 0 0-5-5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9.5 17a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-calendar4" viewBox="0 0 24 24">
      <rect x="3.3" y="5" width="17.4" height="15" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <line x1="3.3" y1="9.6" x2="20.7" y2="9.6" stroke="currentColor" stroke-width="1.5"/>
      <line x1="8" y1="3" x2="8" y2="6.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="16" y1="3" x2="16" y2="6.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-pie4" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 12 L12 3.6 A8.4 8.4 0 0 1 19.7 16.4 Z" fill="currentColor" stroke="none" opacity="0.9"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="360" height="700" fill="#F1EFE8" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Lock screen status/time -->
  <text x="180" y="70" font-size="44" font-weight="600" fill="#1A1A1A" text-anchor="middle">20:30</text>
  <text x="180" y="94" font-size="13" fill="#5F5E5A" text-anchor="middle">Thứ Sáu, 5 tháng 9</text>

  <!-- Card 1: budget warning -->
  <rect x="16" y="130" width="328" height="92" rx="14" fill="#FFFFFF"/>
  <rect x="16" y="130" width="4" height="92" rx="2" fill="#D85A30"/>
  <circle cx="46" cy="156" r="12" fill="#D85A30" fill-opacity="0.14"/>
  <use href="#icon-warning4" x="39" y="149" width="14" height="14" style="color:#D85A30"/>
  <text x="64" y="152" font-size="11" font-weight="600" fill="#5F5E5A">Sora Thu Chi</text>
  <text x="320" y="152" font-size="10" fill="#9B9B9B" text-anchor="end">bây giờ</text>
  <text x="34" y="182" font-size="13" font-weight="600" fill="#1A1A1A">Sắp vượt ngân sách Ăn uống</text>
  <text x="34" y="200" font-size="12" fill="#5F5E5A">Bạn đã dùng 82% ngân sách tháng 9</text>
  <text x="34" y="216" font-size="12" fill="#5F5E5A">cho danh mục Ăn uống.</text>

  <!-- Card 2: daily reminder -->
  <rect x="16" y="238" width="328" height="80" rx="14" fill="#FFFFFF"/>
  <rect x="16" y="238" width="4" height="80" rx="2" fill="#0F6E56"/>
  <circle cx="46" cy="264" r="12" fill="#E1F5EE"/>
  <use href="#icon-bell4" x="39" y="257" width="14" height="14" style="color:#0F6E56"/>
  <text x="64" y="260" font-size="11" font-weight="600" fill="#5F5E5A">Sora Thu Chi</text>
  <text x="320" y="260" font-size="10" fill="#9B9B9B" text-anchor="end">bây giờ</text>
  <text x="34" y="290" font-size="13" font-weight="600" fill="#1A1A1A">Nhắc ghi chép giao dịch</text>
  <text x="34" y="308" font-size="12" fill="#5F5E5A">Bạn chưa ghi giao dịch nào hôm nay.</text>

  <!-- Card 3: recurring bill -->
  <rect x="16" y="334" width="328" height="80" rx="14" fill="#FFFFFF"/>
  <rect x="16" y="334" width="4" height="80" rx="2" fill="#0F6E56"/>
  <circle cx="46" cy="360" r="12" fill="#E1F5EE"/>
  <use href="#icon-calendar4" x="39" y="353" width="14" height="14" style="color:#0F6E56"/>
  <text x="64" y="356" font-size="11" font-weight="600" fill="#5F5E5A">Sora Thu Chi</text>
  <text x="320" y="356" font-size="10" fill="#9B9B9B" text-anchor="end">1 giờ trước</text>
  <text x="34" y="386" font-size="13" font-weight="600" fill="#1A1A1A">Hóa đơn tiền điện sắp đến hạn</text>
  <text x="34" y="404" font-size="12" fill="#5F5E5A">Còn 3 ngày, số tiền 850.000đ.</text>

  <!-- Card 4: weekly summary -->
  <rect x="16" y="430" width="328" height="92" rx="14" fill="#FFFFFF"/>
  <rect x="16" y="430" width="4" height="92" rx="2" fill="#0F6E56"/>
  <circle cx="46" cy="456" r="12" fill="#E1F5EE"/>
  <use href="#icon-pie4" x="39" y="449" width="14" height="14" style="color:#0F6E56"/>
  <text x="64" y="452" font-size="11" font-weight="600" fill="#5F5E5A">Sora Thu Chi</text>
  <text x="320" y="452" font-size="10" fill="#9B9B9B" text-anchor="end">Chủ nhật</text>
  <text x="34" y="482" font-size="13" font-weight="600" fill="#1A1A1A">Tổng kết tuần</text>
  <text x="34" y="500" font-size="12" fill="#5F5E5A">Bạn đã chi nhiều hơn tuần trước 15%.</text>
  <text x="34" y="516" font-size="12" fill="#5F5E5A">Xem chi tiết báo cáo.</text>
</svg>
