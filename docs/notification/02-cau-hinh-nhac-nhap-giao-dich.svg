<svg width="360" height="640" viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <symbol id="icon-back2" viewBox="0 0 24 24">
      <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-chevup" viewBox="0 0 24 24">
      <path d="M6 15 L12 9 L18 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-chevdown" viewBox="0 0 24 24">
      <path d="M6 9 L12 15 L18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="360" height="640" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>

  <!-- App bar -->
  <rect x="0" y="0" width="360" height="64" fill="#0F6E56"/>
  <use href="#icon-back2" x="20" y="22" width="20" height="20" style="color:#FFFFFF"/>
  <text x="52" y="37" font-size="16" font-weight="600" fill="#FFFFFF">Nhắc nhập giao dịch</text>

  <!-- Section: time picker -->
  <text x="20" y="104" font-size="10" font-weight="600" letter-spacing="1" fill="#9B9B9B">THỜI GIAN NHẮC</text>

  <rect x="20" y="120" width="320" height="140" rx="10" fill="#F1EFE8"/>

  <!-- hour column -->
  <use href="#icon-chevup" x="88" y="132" width="20" height="20" style="color:#5F5E5A"/>
  <text x="98" y="176" font-size="15" fill="#B4B2A9" text-anchor="middle">19</text>
  <text x="98" y="202" font-size="26" font-weight="600" fill="#0F6E56" text-anchor="middle">20</text>
  <text x="98" y="228" font-size="15" fill="#B4B2A9" text-anchor="middle">21</text>
  <use href="#icon-chevdown" x="88" y="234" width="20" height="20" style="color:#5F5E5A"/>

  <text x="150" y="202" font-size="24" font-weight="600" fill="#1A1A1A" text-anchor="middle">:</text>

  <!-- minute column -->
  <use href="#icon-chevup" x="192" y="132" width="20" height="20" style="color:#5F5E5A"/>
  <text x="202" y="176" font-size="15" fill="#B4B2A9" text-anchor="middle">15</text>
  <text x="202" y="202" font-size="26" font-weight="600" fill="#0F6E56" text-anchor="middle">30</text>
  <text x="202" y="228" font-size="15" fill="#B4B2A9" text-anchor="middle">45</text>
  <use href="#icon-chevdown" x="192" y="234" width="20" height="20" style="color:#5F5E5A"/>

  <line x1="60" y1="202" x2="330" y2="202" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="188" width="270" height="28" rx="6" fill="#0F6E56" fill-opacity="0.08"/>

  <!-- Section: weekday chips -->
  <text x="20" y="292" font-size="10" font-weight="600" letter-spacing="1" fill="#9B9B9B">LẶP LẠI VÀO CÁC NGÀY</text>

  <g font-size="12" font-weight="600" text-anchor="middle">
    <circle cx="42" cy="322" r="18" fill="#0F6E56"/><text x="42" y="326" fill="#FFFFFF">T2</text>
    <circle cx="88" cy="322" r="18" fill="#0F6E56"/><text x="88" y="326" fill="#FFFFFF">T3</text>
    <circle cx="134" cy="322" r="18" fill="#0F6E56"/><text x="134" y="326" fill="#FFFFFF">T4</text>
    <circle cx="180" cy="322" r="18" fill="#0F6E56"/><text x="180" y="326" fill="#FFFFFF">T5</text>
    <circle cx="226" cy="322" r="18" fill="#0F6E56"/><text x="226" y="326" fill="#FFFFFF">T6</text>
    <circle cx="272" cy="322" r="18" fill="#0F6E56"/><text x="272" y="326" fill="#FFFFFF">T7</text>
    <circle cx="318" cy="322" r="18" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.4"/><text x="318" y="326" fill="#9B9B9B">CN</text>
  </g>

  <line x1="20" y1="368" x2="340" y2="368" stroke="#EFEFEF" stroke-width="1"/>

  <!-- Toggle: only if no transaction logged -->
  <text x="20" y="402" font-size="13" font-weight="600" fill="#1A1A1A">Chỉ nhắc nếu chưa ghi giao dịch</text>
  <text x="20" y="418" font-size="11" fill="#6B6B6B">Bỏ qua nhắc nhở nếu hôm nay bạn đã nhập</text>
  <rect x="284" y="393" width="40" height="22" rx="11" fill="#0F6E56"/>
  <circle cx="316" cy="404" r="9" fill="#FFFFFF"/>

  <line x1="20" y1="440" x2="340" y2="440" stroke="#EFEFEF" stroke-width="1"/>

  <!-- Preview notification -->
  <text x="20" y="468" font-size="10" font-weight="600" letter-spacing="1" fill="#9B9B9B">XEM TRƯỚC THÔNG BÁO</text>
  <rect x="20" y="480" width="320" height="60" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <circle cx="46" cy="510" r="14" fill="#E1F5EE"/>
  <text x="46" y="514" font-size="11" font-weight="600" fill="#0F6E56" text-anchor="middle">S</text>
  <text x="70" y="503" font-size="12" font-weight="600" fill="#1A1A1A">Sora Thu Chi</text>
  <text x="70" y="519" font-size="11" fill="#6B6B6B">Đừng quên ghi lại thu chi hôm nay nhé!</text>
  <text x="320" y="503" font-size="10" fill="#9B9B9B" text-anchor="end">20:30</text>

  <!-- Primary button -->
  <rect x="20" y="568" width="320" height="44" rx="8" fill="#0F6E56"/>
  <text x="180" y="595" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Lưu thay đổi</text>
</svg>
