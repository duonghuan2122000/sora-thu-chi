<svg width="360" height="760" viewBox="0 0 360 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
