<svg width="360" height="880" viewBox="0 0 360 880" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <symbol id="icon-bell3" viewBox="0 0 24 24">
      <path d="M12 2a5 5 0 0 0-5 5v3.1c0 .9-.4 1.8-1 2.4L4.8 14h14.4l-1.2-1.5c-.6-.6-1-1.5-1-2.4V7a5 5 0 0 0-5-5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9.5 17a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-warning3" viewBox="0 0 24 24">
      <path d="M12 3 L21 19 H3 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="12" y1="9.2" x2="12" y2="13.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="12" cy="16.3" r="1" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="icon-calendar3" viewBox="0 0 24 24">
      <rect x="3.3" y="5" width="17.4" height="15" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <line x1="3.3" y1="9.6" x2="20.7" y2="9.6" stroke="currentColor" stroke-width="1.5"/>
      <line x1="8" y1="3" x2="8" y2="6.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="16" y1="3" x2="16" y2="6.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-target3" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="4.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="icon-pie3" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 12 L12 3.6 A8.4 8.4 0 0 1 19.7 16.4 Z" fill="currentColor" stroke="none" opacity="0.9"/>
    </symbol>
    <symbol id="icon-back3" viewBox="0 0 24 24">
      <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-gear3" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3 5.6 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="360" height="880" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>

  <!-- App bar -->
  <rect x="0" y="0" width="360" height="64" fill="#0F6E56"/>
  <use href="#icon-back3" x="20" y="22" width="20" height="20" style="color:#FFFFFF"/>
  <text x="52" y="37" font-size="16" font-weight="600" fill="#FFFFFF">Thông báo</text>
  <use href="#icon-gear3" x="320" y="22" width="20" height="20" style="color:#FFFFFF"/>

  <!-- Filter tabs -->
  <text x="20" y="92" font-size="13" font-weight="600" fill="#0F6E56">Tất cả</text>
  <rect x="20" y="100" width="42" height="2" fill="#0F6E56"/>
  <text x="80" y="92" font-size="13" fill="#9B9B9B">Chưa đọc</text>
  <line x1="20" y1="112" x2="340" y2="112" stroke="#EFEFEF" stroke-width="1"/>

  <!-- Group: Hom nay -->
  <text x="20" y="136" font-size="11" font-weight="600" fill="#9B9B9B">HÔM NAY</text>

  <!-- Item 1: budget warning - unread -->
  <circle cx="10" cy="176" r="4" fill="#0F6E56"/>
  <circle cx="40" cy="176" r="18" fill="#D85A30" fill-opacity="0.14"/>
  <use href="#icon-warning3" x="31" y="167" width="18" height="18" style="color:#D85A30"/>
  <text x="66" y="170" font-size="13" font-weight="600" fill="#1A1A1A">Sắp vượt ngân sách Ăn uống</text>
  <text x="66" y="186" font-size="11" fill="#6B6B6B">Đã dùng 82% ngân sách tháng này</text>
  <text x="66" y="200" font-size="11" fill="#6B6B6B">(2.460.000đ / 3.000.000đ)</text>
  <text x="330" y="170" font-size="10" fill="#9B9B9B" text-anchor="end">2 giờ trước</text>
  <line x1="20" y1="220" x2="340" y2="220" stroke="#EFEFEF" stroke-width="1"/>

  <!-- Item 2: daily reminder - unread -->
  <circle cx="10" cy="254" r="4" fill="#0F6E56"/>
  <circle cx="40" cy="254" r="18" fill="#E1F5EE"/>
  <use href="#icon-bell3" x="31" y="245" width="18" height="18" style="color:#0F6E56"/>
  <text x="66" y="250" font-size="13" font-weight="600" fill="#1A1A1A">Nhắc ghi chép hôm nay</text>
  <text x="66" y="266" font-size="11" fill="#6B6B6B">Bạn chưa ghi giao dịch nào hôm nay</text>
  <text x="330" y="250" font-size="10" fill="#9B9B9B" text-anchor="end">20:30</text>
  <line x1="20" y1="284" x2="340" y2="284" stroke="#EFEFEF" stroke-width="1"/>

  <!-- Item 3: bill due - read -->
  <circle cx="40" cy="318" r="18" fill="#E1F5EE"/>
  <use href="#icon-calendar3" x="31" y="309" width="18" height="18" style="color:#0F6E56"/>
  <text x="66" y="314" font-size="13" fill="#5F5E5A">Hóa đơn tiền điện sắp đến hạn</text>
  <text x="66" y="330" font-size="11" fill="#9B9B9B">Còn 3 ngày · 850.000đ</text>
  <text x="330" y="314" font-size="10" fill="#9B9B9B" text-anchor="end">08:00</text>
  <line x1="20" y1="348" x2="340" y2="348" stroke="#EFEFEF" stroke-width="1"/>

  <!-- Group: Tuan nay -->
  <text x="20" y="374" font-size="11" font-weight="600" fill="#9B9B9B">TUẦN NÀY</text>

  <!-- Item 4: goal - read -->
  <circle cx="40" cy="414" r="18" fill="#E1F5EE"/>
  <use href="#icon-target3" x="31" y="405" width="18" height="18" style="color:#0F6E56"/>
  <text x="66" y="410" font-size="13" fill="#5F5E5A">Mục tiêu Mua xe máy</text>
  <text x="66" y="426" font-size="11" fill="#9B9B9B">Đã đạt 75% mục tiêu tiết kiệm</text>
  <text x="330" y="410" font-size="10" fill="#9B9B9B" text-anchor="end">Thứ 3</text>
  <line x1="20" y1="444" x2="340" y2="444" stroke="#EFEFEF" stroke-width="1"/>

  <!-- Item 5: weekly summary - read -->
  <circle cx="40" cy="478" r="18" fill="#E1F5EE"/>
  <use href="#icon-pie3" x="31" y="469" width="18" height="18" style="color:#0F6E56"/>
  <text x="66" y="474" font-size="13" fill="#5F5E5A">Tổng kết tuần</text>
  <text x="66" y="490" font-size="11" fill="#9B9B9B">Bạn chi nhiều hơn tuần trước 15%</text>
  <text x="330" y="474" font-size="10" fill="#9B9B9B" text-anchor="end">Chủ nhật</text>
  <line x1="20" y1="508" x2="340" y2="508" stroke="#EFEFEF" stroke-width="1"/>

  <!-- Item 6: over budget - read -->
  <circle cx="40" cy="542" r="18" fill="#D85A30" fill-opacity="0.14"/>
  <use href="#icon-warning3" x="31" y="533" width="18" height="18" style="color:#D85A30"/>
  <text x="66" y="538" font-size="13" fill="#5F5E5A">Vượt ngân sách Giải trí</text>
  <text x="66" y="554" font-size="11" fill="#9B9B9B">Đã chi vượt 110% ngân sách danh mục</text>
  <text x="330" y="538" font-size="10" fill="#9B9B9B" text-anchor="end">Thứ 5</text>
  <line x1="20" y1="572" x2="340" y2="572" stroke="#EFEFEF" stroke-width="1"/>
</svg>
