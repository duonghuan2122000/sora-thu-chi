<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><clipPath id="frame5"><rect width="360" height="780" rx="28"/></clipPath></defs>
  <g clip-path="url(#frame5)">
    <rect width="360" height="780" fill="#FFFFFF"/>
    <rect width="360" height="80" fill="#0F6E56"/>
    <path d="M28 40 l-8 8 l8 8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="46" fill="#FFFFFF" font-size="16" font-weight="600">Thêm khoản Chi</text>

    <!-- amount display -->
    <text x="180" y="150" fill="#9B9B9B" font-size="11" text-anchor="middle">SỐ TIỀN</text>
    <text x="180" y="112" fill="#D85A30" font-size="12" text-anchor="middle" font-family="monospace">500.000 + 750.000</text>
    <text x="180" y="150" fill="#1A1A1A" font-size="32" font-weight="700" text-anchor="middle" dy="14">1.250.000 đ</text>
    <line x1="60" y1="182" x2="300" y2="182" stroke="#E0E0E0" stroke-width="1"/>

    <!-- category / wallet quick row -->
    <rect x="24" y="198" width="150" height="40" rx="8" fill="#F1EFE8"/>
    <circle cx="46" cy="218" r="10" fill="#D85A30"/>
    <text x="65" y="222" fill="#1A1A1A" font-size="12">Ăn uống</text>
    <rect x="186" y="198" width="150" height="40" rx="8" fill="#F1EFE8"/>
    <circle cx="208" cy="218" r="10" fill="#3D8C77"/>
    <text x="227" y="222" fill="#1A1A1A" font-size="12">Tiền mặt</text>

    <!-- calculator keypad -->
    <!-- row helper function pattern manually -->
    <!-- Row 1: 7 8 9 ÷ -->
    <g font-size="18" fill="#1A1A1A" text-anchor="middle">
      <circle cx="60" cy="290" r="26" fill="none" stroke="#E0E0E0"/><text x="60" y="297">7</text>
      <circle cx="140" cy="290" r="26" fill="none" stroke="#E0E0E0"/><text x="140" y="297">8</text>
      <circle cx="220" cy="290" r="26" fill="none" stroke="#E0E0E0"/><text x="220" y="297">9</text>
      <circle cx="300" cy="290" r="26" fill="#F1EFE8"/><text x="300" y="297" fill="#0F6E56">÷</text>

      <circle cx="60" cy="352" r="26" fill="none" stroke="#E0E0E0"/><text x="60" y="359">4</text>
      <circle cx="140" cy="352" r="26" fill="none" stroke="#E0E0E0"/><text x="140" y="359">5</text>
      <circle cx="220" cy="352" r="26" fill="none" stroke="#E0E0E0"/><text x="220" y="359">6</text>
      <circle cx="300" cy="352" r="26" fill="#F1EFE8"/><text x="300" y="359" fill="#0F6E56">×</text>

      <circle cx="60" cy="414" r="26" fill="none" stroke="#E0E0E0"/><text x="60" y="421">1</text>
      <circle cx="140" cy="414" r="26" fill="none" stroke="#E0E0E0"/><text x="140" y="421">2</text>
      <circle cx="220" cy="414" r="26" fill="none" stroke="#E0E0E0"/><text x="220" y="421">3</text>
      <circle cx="300" cy="414" r="26" fill="#F1EFE8"/><text x="300" y="421" fill="#0F6E56">−</text>

      <circle cx="60" cy="476" r="26" fill="none" stroke="#E0E0E0"/><text x="60" y="483">.</text>
      <circle cx="140" cy="476" r="26" fill="none" stroke="#E0E0E0"/><text x="140" y="483">0</text>
      <circle cx="220" cy="476" r="26" fill="none" stroke="#E0E0E0"/>
      <path d="M212 470 h16 M212 476 h12 M212 482 h16" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="300" cy="476" r="26" fill="#F1EFE8"/><text x="300" y="483" fill="#0F6E56">+</text>
