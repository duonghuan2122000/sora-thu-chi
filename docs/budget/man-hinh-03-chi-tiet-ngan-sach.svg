    <text x="336" y="589" font-size="13" font-weight="600" fill="#D85A30" text-anchor="end">-65.000 đ</text>

    <line x1="24" y1="612" x2="336" y2="612" stroke="#EFEFEF" stroke-width="1"/>

    <!-- txn row 3 -->
    <circle cx="36" cy="642" r="15" fill="#FBE7DE"/>
    <path d="M31,636 v12 M36,636 v12 M41,636 v12" stroke="#D85A30" stroke-width="1.4" stroke-linecap="round"/>
