    <rect x="320" y="31" width="12" height="14" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <line x1="320" y1="35" x2="332" y2="35" stroke="#FFFFFF" stroke-width="1"/>

