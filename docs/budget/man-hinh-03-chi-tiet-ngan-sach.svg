    <text x="99" y="727" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Chỉnh sửa</text>

    <rect x="186" y="700" width="150" height="44" rx="8" fill="#0F6E56"/>
    <text x="261" y="727" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Lưu trữ ngân sách</text>
