    <text x="40" y="150" font-size="24" font-weight="600" fill="#D85A30">3.210.000 đ</text>
    <text x="40" y="168" font-size="12" fill="#9B9B9B">trên 3.000.000 đ giới hạn</text>

    <text x="320" y="122" font-size="11" fill="#6B6B6B" text-anchor="end">Trạng thái</text>
    <rect x="270" y="132" width="70" height="24" rx="12" fill="#FBE7DE"/>
    <text x="305" y="148" font-size="11" font-weight="600" fill="#D85A30" text-anchor="middle">Vượt 107%</text>

    <rect x="40" y="188" width="280" height="8" rx="4" fill="#F1EFE8"/>
    <rect x="40" y="188" width="280" height="8" rx="4" fill="#D85A30"/>
