    <text x="336" y="500" font-size="11" font-weight="600" fill="#0F6E56" text-anchor="end">Xem tất cả</text>

    <!-- txn row 1 -->
    <circle cx="36" cy="530" r="15" fill="#FBE7DE"/>
    <path d="M31,524 v12 M36,524 v12 M41,524 v12" stroke="#D85A30" stroke-width="1.4" stroke-linecap="round"/>
    <text x="60" y="526" font-size="13" font-weight="600" fill="#1A1A1A">Quán ăn Ngon</text>
