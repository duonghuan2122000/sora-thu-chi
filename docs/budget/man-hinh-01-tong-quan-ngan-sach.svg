<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="screenClip1">
      <rect x="0" y="0" width="360" height="780" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="360" height="780" rx="28" ry="28" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>

  <g clip-path="url(#screenClip1)">
    <!-- Header -->
    <rect x="0" y="0" width="360" height="132" fill="#0F6E56"/>
    <text x="24" y="46" font-size="16" font-weight="600" fill="#FFFFFF">Ngân sách</text>

    <!-- add button top-right -->
    <circle cx="330" cy="40" r="16" fill="rgba(255,255,255,0.16)"/>
    <line x1="330" y1="33" x2="330" y2="47" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="323" y1="40" x2="337" y2="40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- month selector -->
    <polyline points="150,80 144,86 150,92" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="90" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tháng 9, 2026</text>
    <polyline points="210,80 216,86 210,92" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Summary floating card -->
    <rect x="20" y="110" width="320" height="112" rx="10" fill="#FFFFFF" stroke="#EFEFEF" stroke-width="1"/>
    <text x="40" y="140" font-size="11" fill="#6B6B6B">Tổng ngân sách tháng này</text>
    <text x="40" y="166" font-size="22" font-weight="600" fill="#1A1A1A">10.200.000 đ</text>
    <text x="152" y="166" font-size="12" fill="#9B9B9B"> / 15.000.000 đ</text>

    <!-- progress bar total (68%) -->
    <rect x="40" y="180" width="280" height="8" rx="4" fill="#F1EFE8"/>
    <rect x="40" y="180" width="190" height="8" rx="4" fill="#0F6E56"/>

    <text x="40" y="205" font-size="11" fill="#6B6B6B">Còn lại 4.800.000 đ</text>
    <text x="320" y="205" font-size="11" fill="#6B6B6B" text-anchor="end">12 ngày còn lại</text>

    <!-- Section header -->
    <text x="24" y="252" font-size="10" font-weight="600" fill="#9B9B9B" letter-spacing="0.5">DANH MỤC</text>
    <text x="336" y="252" font-size="11" font-weight="600" fill="#0F6E56" text-anchor="end">Sao chép tháng trước</text>

    <!-- Row 1: Ăn uống - 107% over -->
    <circle cx="36" cy="284" r="16" fill="#FBE7DE"/>
    <path d="M31,278 v12 M36,278 v12 M41,278 v12" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round"/>
    <text x="60" y="280" font-size="13" font-weight="600" fill="#1A1A1A">Ăn uống</text>
    <text x="60" y="295" font-size="11" fill="#6B6B6B">3.210.000 đ / 3.000.000 đ</text>
    <text x="336" y="285" font-size="12" font-weight="600" fill="#D85A30" text-anchor="end">107%</text>
    <rect x="24" y="304" width="312" height="6" rx="3" fill="#F1EFE8"/>
    <rect x="24" y="304" width="312" height="6" rx="3" fill="#D85A30"/>

    <line x1="24" y1="328" x2="336" y2="328" stroke="#EFEFEF" stroke-width="1"/>

    <!-- Row 2: Hóa đơn - 84% near threshold -->
    <circle cx="36" cy="358" r="16" fill="#E1F5EE"/>
    <rect x="29" y="353" width="14" height="10" rx="1.5" fill="none" stroke="#3D8C77" stroke-width="1.6"/>
    <line x1="29" y1="357" x2="43" y2="357" stroke="#3D8C77" stroke-width="1.2"/>
    <text x="60" y="354" font-size="13" font-weight="600" fill="#1A1A1A">Hóa đơn</text>
    <text x="60" y="369" font-size="11" fill="#6B6B6B">2.100.000 đ / 2.500.000 đ</text>
    <text x="336" y="359" font-size="12" font-weight="600" fill="#D85A30" text-anchor="end">84%</text>
    <rect x="24" y="378" width="312" height="6" rx="3" fill="#F1EFE8"/>
    <rect x="24" y="378" width="262" height="6" rx="3" fill="#D85A30" opacity="0.6"/>

    <line x1="24" y1="402" x2="336" y2="402" stroke="#EFEFEF" stroke-width="1"/>

    <!-- Row 3: Giải trí - 96% -->
    <circle cx="36" cy="432" r="16" fill="#E1F5EE"/>
    <circle cx="36" cy="432" r="6" fill="none" stroke="#3D8C77" stroke-width="1.6"/>
    <line x1="36" y1="432" x2="40" y2="428" stroke="#3D8C77" stroke-width="1.6" stroke-linecap="round"/>
    <text x="60" y="428" font-size="13" font-weight="600" fill="#1A1A1A">Giải trí</text>
    <text x="60" y="443" font-size="11" fill="#6B6B6B">1.150.000 đ / 1.200.000 đ</text>
    <text x="336" y="433" font-size="12" font-weight="600" fill="#D85A30" text-anchor="end">96%</text>
    <rect x="24" y="452" width="312" height="6" rx="3" fill="#F1EFE8"/>
    <rect x="24" y="452" width="300" height="6" rx="3" fill="#D85A30" opacity="0.6"/>

    <line x1="24" y1="476" x2="336" y2="476" stroke="#EFEFEF" stroke-width="1"/>

    <!-- Row 4: Di chuyển - 53% normal -->
    <circle cx="36" cy="506" r="16" fill="#E1F5EE"/>
    <path d="M28,510 h16 l-2,-6 h-12 z" fill="none" stroke="#3D8C77" stroke-width="1.5"/>
    <circle cx="31" cy="512" r="1.6" fill="#3D8C77"/>
    <circle cx="41" cy="512" r="1.6" fill="#3D8C77"/>
    <text x="60" y="502" font-size="13" font-weight="600" fill="#1A1A1A">Di chuyển</text>
    <text x="60" y="517" font-size="11" fill="#6B6B6B">800.000 đ / 1.500.000 đ</text>
    <text x="336" y="507" font-size="12" font-weight="600" fill="#0F6E56" text-anchor="end">53%</text>
    <rect x="24" y="526" width="312" height="6" rx="3" fill="#F1EFE8"/>
    <rect x="24" y="526" width="166" height="6" rx="3" fill="#0F6E56"/>

    <line x1="24" y1="550" x2="336" y2="550" stroke="#EFEFEF" stroke-width="1"/>

    <!-- Row 5: Mua sắm - 45% normal -->
    <circle cx="36" cy="580" r="16" fill="#E1F5EE"/>
    <path d="M29,575 h14 l1.5,11 h-17 z" fill="none" stroke="#3D8C77" stroke-width="1.5"/>
    <path d="M32,575 v-2 a4,4 0 0 1 8,0 v2" fill="none" stroke="#3D8C77" stroke-width="1.4"/>
    <text x="60" y="576" font-size="13" font-weight="600" fill="#1A1A1A">Mua sắm</text>
    <text x="60" y="591" font-size="11" fill="#6B6B6B">450.000 đ / 1.000.000 đ</text>
    <text x="336" y="581" font-size="12" font-weight="600" fill="#0F6E56" text-anchor="end">45%</text>
    <rect x="24" y="600" width="312" height="6" rx="3" fill="#F1EFE8"/>
    <rect x="24" y="600" width="140" height="6" rx="3" fill="#0F6E56"/>

    <!-- Bottom nav -->
    <rect x="0" y="700" width="360" height="80" fill="#FFFFFF" stroke="#EFEFEF" stroke-width="1"/>
    <!-- home -->
    <path d="M52,724 l14,-11 14,11 v16 h-28 z" fill="none" stroke="#9B9B9B" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="66" y="758" font-size="9" fill="#9B9B9B" text-anchor="middle">Tổng quan</text>
    <!-- list -->
    <line x1="112" y1="720" x2="140" y2="720" stroke="#9B9B9B" stroke-width="2" stroke-linecap="round"/>
    <line x1="112" y1="728" x2="140" y2="728" stroke="#9B9B9B" stroke-width="2" stroke-linecap="round"/>
    <line x1="112" y1="736" x2="140" y2="736" stroke="#9B9B9B" stroke-width="2" stroke-linecap="round"/>
    <text x="126" y="758" font-size="9" fill="#9B9B9B" text-anchor="middle">Giao dịch</text>

    <!-- FAB -->
    <circle cx="180" cy="716" r="26" fill="#0F6E56"/>
    <line x1="180" y1="706" x2="180" y2="726" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="170" y1="716" x2="190" y2="716" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>

    <!-- chart-pie (active) -->
    <circle cx="234" cy="728" r="12" fill="none" stroke="#0F6E56" stroke-width="1.8"/>
    <path d="M234,716 v12 h12 a12,12 0 0 0 -12,-12 z" fill="#0F6E56"/>
    <text x="234" y="758" font-size="9" font-weight="600" fill="#0F6E56" text-anchor="middle">Báo cáo</text>

    <!-- settings -->
    <circle cx="294" cy="728" r="9" fill="none" stroke="#9B9B9B" stroke-width="1.8"/>
    <circle cx="294" cy="728" r="3" fill="none" stroke="#9B9B9B" stroke-width="1.6"/>
    <text x="294" y="758" font-size="9" fill="#9B9B9B" text-anchor="middle">Cài đặt</text>
  </g>
</svg>
