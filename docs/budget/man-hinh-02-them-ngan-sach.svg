<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="screenClip2">
      <rect x="0" y="0" width="360" height="780" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="360" height="780" rx="28" ry="28" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>

  <g clip-path="url(#screenClip2)">
    <!-- App bar (sub-page) -->
    <rect x="0" y="0" width="360" height="76" fill="#0F6E56"/>
    <polyline points="34,38 26,46 34,54" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="52" font-size="16" font-weight="600" fill="#FFFFFF">Thêm ngân sách</text>

    <!-- Scope segmented control -->
    <text x="24" y="106" font-size="10" font-weight="600" fill="#9B9B9B" letter-spacing="0.5">PHẠM VI NGÂN SÁCH</text>
    <rect x="24" y="114" width="312" height="40" rx="8" fill="#F1EFE8"/>
    <rect x="26" y="116" width="154" height="36" rx="7" fill="#0F6E56"/>
    <text x="103" y="139" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Theo danh mục</text>
    <text x="257" y="139" font-size="13" font-weight="600" fill="#5F5E5A" text-anchor="middle">Tổng cộng</text>

    <!-- Category selector -->
    <text x="24" y="182" font-size="10" font-weight="600" fill="#9B9B9B" letter-spacing="0.5">DANH MỤC</text>
    <rect x="24" y="190" width="312" height="56" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <circle cx="50" cy="218" r="15" fill="#FBE7DE"/>
    <path d="M45,212 v12 M50,212 v12 M55,212 v12" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round"/>
    <text x="74" y="223" font-size="14" font-weight="600" fill="#1A1A1A">Ăn uống</text>
    <polyline points="326,212 332,218 326,224" fill="none" stroke="#9B9B9B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Amount input -->
    <text x="24" y="278" font-size="10" font-weight="600" fill="#9B9B9B" letter-spacing="0.5">SỐ TIỀN GIỚI HẠN</text>
    <rect x="24" y="286" width="312" height="56" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="40" y="322" font-size="22" font-weight="600" fill="#1A1A1A">3.000.000</text>
    <text x="188" y="322" font-size="14" fill="#6B6B6B">đ</text>
    <circle cx="312" cy="314" r="14" fill="#E1F5EE"/>
    <rect x="306" y="308" width="12" height="12" rx="2" fill="none" stroke="#3D8C77" stroke-width="1.4"/>
    <line x1="306" y1="312" x2="318" y2="312" stroke="#3D8C77" stroke-width="1.1"/>

    <!-- Period -->
    <text x="24" y="374" font-size="10" font-weight="600" fill="#9B9B9B" letter-spacing="0.5">CHU KỲ</text>
    <rect x="24" y="382" width="98" height="38" rx="8" fill="#F1EFE8"/>
    <text x="73" y="406" font-size="12" fill="#5F5E5A" text-anchor="middle">Tuần</text>
    <rect x="130" y="382" width="98" height="38" rx="8" fill="#0F6E56"/>
    <text x="179" y="406" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tháng</text>
    <rect x="236" y="382" width="100" height="38" rx="8" fill="#F1EFE8"/>
    <text x="286" y="406" font-size="12" fill="#5F5E5A" text-anchor="middle">Năm</text>

    <!-- Wallet applied -->
    <rect x="24" y="440" width="312" height="1" fill="#EFEFEF"/>
    <text x="24" y="472" font-size="13" fill="#1A1A1A">Ví áp dụng</text>
    <text x="336" y="472" font-size="12" fill="#6B6B6B" text-anchor="end">Tất cả ví</text>
    <polyline points="340,466 346,472 340,478" fill="none" stroke="#9B9B9B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,0)"/>

    <rect x="24" y="494" width="312" height="1" fill="#EFEFEF"/>

    <!-- Recurring toggle -->
    <text x="24" y="526" font-size="13" fill="#1A1A1A">Lặp lại tự động mỗi kỳ</text>
    <rect x="296" y="512" width="40" height="22" rx="11" fill="#0F6E56"/>
    <circle cx="325" cy="523" r="9" fill="#FFFFFF"/>

    <rect x="24" y="548" width="312" height="1" fill="#EFEFEF"/>

    <!-- Rollover toggle -->
    <text x="24" y="580" font-size="13" fill="#1A1A1A">Cộng dồn phần chưa dùng hết</text>
    <rect x="296" y="566" width="40" height="22" rx="11" fill="#E0E0E0"/>
    <circle cx="307" cy="577" r="9" fill="#FFFFFF"/>

    <rect x="24" y="602" width="312" height="1" fill="#EFEFEF"/>

    <!-- Alert thresholds -->
    <text x="24" y="634" font-size="13" fill="#1A1A1A">Ngưỡng cảnh báo</text>
    <text x="336" y="634" font-size="12" fill="#6B6B6B" text-anchor="end">80% và 100%</text>
    <polyline points="336,628 342,634 336,640" fill="none" stroke="#9B9B9B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Save button -->
    <rect x="24" y="700" width="312" height="44" rx="8" fill="#0F6E56"/>
    <text x="180" y="727" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Lưu ngân sách</text>
  </g>
</svg>
