<svg viewBox="0 0 360 800" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="360" height="800" rx="28" ry="28"/></clipPath>
  </defs>
  <rect x="0" y="0" width="360" height="800" rx="28" ry="28" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <text x="34" y="38" font-family='Roboto, Arial, sans-serif' font-size="13" font-weight="600" fill="#1A1A1A">9:41</text>
    <g fill="#1A1A1A">
      <rect x="290" y="30" width="16" height="9" rx="2" fill="none" stroke="#1A1A1A" stroke-width="1.3"/>
      <rect x="292" y="32" width="10" height="5" fill="#1A1A1A"/>
      <rect x="270" y="31" width="4" height="8" rx="1"/>
      <rect x="277" y="28" width="4" height="11" rx="1"/>
      <rect x="284" y="25" width="4" height="14" rx="1"/>
    </g>
    <path d="M32 64 L22 74 L32 84" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="80" font-family='Roboto, Arial, sans-serif' font-size="16" font-weight="600" fill="#1A1A1A">Quên mã PIN?</text>

    <circle cx="180.0" cy="180" r="36" fill="#FBEAE3"/>
    <g transform="translate(164.0,164)" fill="none" stroke="#D85A30" stroke-width="2">
      <path d="M16 4 L30 28 L2 28 Z" stroke-linejoin="round"/>
      <line x1="16" y1="13" x2="16" y2="21" stroke-linecap="round"/>
      <circle cx="16" cy="25" r="0.6" fill="#D85A30" stroke="none"/>
    </g>

    <text x="180.0" y="252" font-family='Roboto, Arial, sans-serif' font-size="15" font-weight="600" text-anchor="middle" fill="#1A1A1A">Không thể khôi phục mã PIN</text>
    <text x="24" y="280" font-family='Roboto, Arial, sans-serif' font-size="12" fill="#5F5E5A"><tspan x="24" dy="0">Vì ứng dụng hoạt động offline, chúng tôi không thể</tspan><tspan x="24" dy="18">khôi phục mã PIN đã quên. Tiếp tục sẽ XÓA TOÀN BỘ</tspan><tspan x="24" dy="18">giao dịch, ví, ngân sách và mục tiêu trên thiết bị này.</tspan></text>

    <rect x="24" y="360" width="312" height="56" rx="10" fill="#E1F5EE"/>
    <text x="40" y="384" font-family='Roboto, Arial, sans-serif' font-size="11" fill="#3D8C77">Có file sao lưu (backup)?</text>
    <text x="40" y="402" font-family='Roboto, Arial, sans-serif' font-size="11" fill="#3D8C77">Khôi phục dữ liệu thay vì xóa</text>
    <path d="M320 380 L328 388 L320 396" fill="none" stroke="#0F6E56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="24" y="452" font-family='Roboto, Arial, sans-serif' font-size="12" fill="#5F5E5A">Nhập "XÓA DỮ LIỆU" để xác nhận:</text>
    <rect x="24" y="466" width="312" height="48" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
    <text x="40" y="496" font-family='Roboto, Arial, sans-serif' font-size="13" fill="#9B9B9B">Nhập tại đây...</text>

    <rect x="24" y="660" width="312" height="44" rx="8" fill="#D85A30"/>
    <text x="180.0" y="688" font-family='Roboto, Arial, sans-serif' font-size="14" font-weight="600" text-anchor="middle" fill="#FFFFFF">Xóa toàn bộ dữ liệu</text>

    <rect x="24" y="716" width="312" height="44" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
    <text x="180.0" y="744" font-family='Roboto, Arial, sans-serif' font-size="14" font-weight="600" text-anchor="middle" fill="#1A1A1A">Hủy, quay lại màn hình khóa</text>
