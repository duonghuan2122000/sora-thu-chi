<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame3"><rect x="0" y="0" width="360" height="780" rx="28" ry="28"/></clipPath>
  </defs>
  <rect x="0" y="0" width="360" height="780" rx="28" ry="28" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <g clip-path="url(#frame3)">
    <rect x="0" y="0" width="360" height="780" fill="#FFFFFF"/>

    <!-- small receipt thumbnail with scan-line animation feel -->
    <rect x="130" y="130" width="100" height="140" rx="8" fill="#F1EFE8" stroke="#E0E0E0"/>
    <g opacity="0.6" font-size="6" fill="#5F5E5A">
      <text x="180" y="152" text-anchor="middle" font-weight="700" font-size="7">CIRCLE K</text>
      <line x1="140" y1="160" x2="220" y2="160" stroke="#B4B2A9" stroke-width="0.5"/>
      <text x="140" y="172">Cà phê sữa đá</text>
      <text x="140" y="184">Bánh mì trứng</text>
      <text x="140" y="196">Nước suối</text>
      <line x1="140" y1="206" x2="220" y2="206" stroke="#B4B2A9" stroke-width="0.5"/>
      <text x="140" y="220" font-weight="700">TỔNG: 55.000</text>
    </g>
    <!-- scan line -->
    <rect x="130" y="210" width="100" height="3" fill="#0F6E56" opacity="0.8"/>
    <rect x="130" y="130" width="100" height="140" rx="8" fill="none" stroke="#0F6E56" stroke-width="2"/>

    <text x="180" y="310" fill="#1A1A1A" font-size="15" font-weight="600" text-anchor="middle">Đang xử lý hóa đơn...</text>
    <text x="180" y="332" fill="#6B6B6B" font-size="11" text-anchor="middle">Toàn bộ xử lý diễn ra ngay trên máy của bạn</text>

    <!-- progress steps -->
    <g font-size="13">
      <circle cx="60" cy="380" r="10" fill="#0F6E56"/>
      <path d="M55 380 l3.5 3.5 l7 -8" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="385" fill="#1A1A1A">Đọc & xử lý ảnh hóa đơn</text>

      <circle cx="60" cy="418" r="10" fill="#0F6E56"/>
      <path d="M55 418 l3.5 3.5 l7 -8" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="423" fill="#1A1A1A">Nhận diện chữ (OCR on-device)</text>

      <circle cx="60" cy="456" r="10" fill="none" stroke="#0F6E56" stroke-width="2.5"/>
      <path d="M60 449 v7 l5 3" stroke="#0F6E56" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="80" y="461" fill="#1A1A1A" font-weight="500">Phân tích số tiền, ngày, danh mục</text>

      <circle cx="60" cy="494" r="10" fill="none" stroke="#B4B2A9" stroke-width="2"/>
      <text x="80" y="499" fill="#9B9B9B">Chuẩn bị màn hình xác nhận</text>
    </g>

    <text x="180" y="740" fill="#9B9B9B" font-size="10" text-anchor="middle">Không gửi dữ liệu lên bất kỳ máy chủ nào</text>
  </g>
</svg>
