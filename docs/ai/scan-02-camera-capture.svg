    <!-- bottom controls -->
    <rect x="0" y="670" width="360" height="110" fill="#0F0F0F"/>
    <!-- gallery thumb -->
    <rect x="40" y="700" width="46" height="46" rx="8" fill="#3D3D3D" stroke="#6B6B6B"/>
    <path d="M46 738 l10 -12 l8 8 l6 -8 l10 12 z" fill="#9B9B9B"/>
    <text x="63" y="762" fill="#9B9B9B" font-size="9" text-anchor="middle">Thư viện</text>

    <!-- shutter -->
