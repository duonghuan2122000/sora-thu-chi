    <g opacity="0.55" font-size="9" fill="#333333">
      <text x="180" y="180" text-anchor="middle" font-weight="600" font-size="11">CIRCLE K VIỆT NAM</text>
      <text x="180" y="196" text-anchor="middle">CN Trần Duy Hưng</text>
      <line x1="106" y1="210" x2="254" y2="210" stroke="#999" stroke-width="0.5"/>
      <text x="106" y="228">Cà phê sữa đá</text><text x="254" y="228" text-anchor="end">25.000</text>
      <text x="106" y="244">Bánh mì trứng</text><text x="254" y="244" text-anchor="end">20.000</text>
      <text x="106" y="260">Nước suối</text><text x="254" y="260" text-anchor="end">10.000</text>
      <line x1="106" y1="272" x2="254" y2="272" stroke="#999" stroke-width="0.5"/>
      <text x="106" y="292" font-weight="700">TỔNG CỘNG</text><text x="254" y="292" text-anchor="end" font-weight="700">55.000</text>
      <text x="180" y="320" text-anchor="middle">12/09/2026  08:24</text>
    </g>

    <!-- top bar -->
    <circle cx="34" cy="46" r="18" fill="#000000" opacity="0.4"/>
    <path d="M40 38 l-12 8 l12 8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="52" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Quét hóa đơn</text>
    <circle cx="326" cy="46" r="18" fill="#000000" opacity="0.4"/>
    <path d="M320 38 l3 5 l3 -3 l4 8 h-14 z" fill="#FFFFFF"/>

    <!-- guide frame -->
    <rect x="40" y="96" width="280" height="500" rx="10" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 8" opacity="0.85"/>
    <!-- corner markers -->
    <g stroke="#0F6E56" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M40 126 v-20 a10 10 0 0 1 10 -10 h20"/>
      <path d="M290 96 h20 a10 10 0 0 1 10 10 v20"/>
      <path d="M320 566 v20 a10 10 0 0 1 -10 10 h-20"/>
      <path d="M70 596 h-20 a10 10 0 0 1 -10 -10 v-20"/>
    </g>
    <rect x="60" y="612" width="240" height="30" rx="15" fill="#000000" opacity="0.45"/>
