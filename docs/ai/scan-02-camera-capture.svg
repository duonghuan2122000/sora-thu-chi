<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame2"><rect x="0" y="0" width="360" height="780" rx="28" ry="28"/></clipPath>
  </defs>
  <rect x="0" y="0" width="360" height="780" rx="28" ry="28" fill="#0F0F0F" stroke="#E0E0E0" stroke-width="1.5"/>
  <g clip-path="url(#frame2)">
    <!-- camera viewfinder background -->
    <rect x="0" y="0" width="360" height="780" fill="#1A1A1A"/>
