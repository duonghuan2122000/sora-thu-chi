<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame5"><rect x="0" y="0" width="360" height="780" rx="28" ry="28"/></clipPath>
  </defs>
  <rect x="0" y="0" width="360" height="780" rx="28" ry="28" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <g clip-path="url(#frame5)">
    <rect x="0" y="0" width="360" height="780" fill="#FFFFFF"/>

    <!-- App bar -->
    <rect x="0" y="0" width="360" height="64" fill="#0F6E56"/>
    <path d="M32 32 l-8 6 l8 6" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="38" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Quét hóa đơn AI</text>

    <!-- Section: CHUNG -->
    <text x="20" y="92" fill="#9B9B9B" font-size="10" font-weight="600">CHUNG</text>
    <rect x="20" y="100" width="320" height="122" rx="10" fill="#FFFFFF" stroke="#EFEFEF"/>

    <text x="36" y="128" fill="#1A1A1A" font-size="13">Bật quét hóa đơn</text>
    <text x="36" y="144" fill="#5F5E5A" font-size="10">Cho phép thêm giao dịch từ ảnh</text>
    <rect x="288" y="114" width="36" height="20" rx="10" fill="#0F6E56"/>
    <circle cx="314" cy="124" r="8" fill="#FFFFFF"/>

    <line x1="36" y1="154" x2="324" y2="154" stroke="#EFEFEF"/>

    <text x="36" y="178" fill="#1A1A1A" font-size="13">Ngôn ngữ nhận diện (OCR)</text>
    <text x="324" y="178" fill="#5F5E5A" font-size="12" text-anchor="end">Tự động</text>
    <path d="M330 174 l6 4 l-6 4" stroke="#B4B2A9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="36" y1="188" x2="324" y2="188" stroke="#EFEFEF"/>

    <text x="36" y="212" fill="#1A1A1A" font-size="13">Tự động tăng độ nét ảnh</text>
    <rect x="288" y="198" width="36" height="20" rx="10" fill="#0F6E56"/>
    <circle cx="314" cy="208" r="8" fill="#FFFFFF"/>

    <!-- Section: AI NANG CAO -->
    <text x="20" y="250" fill="#9B9B9B" font-size="10" font-weight="600">AI NÂNG CAO</text>
    <rect x="20" y="258" width="320" height="90" rx="10" fill="#FFFFFF" stroke="#EFEFEF"/>

    <text x="36" y="286" fill="#1A1A1A" font-size="13">Chế độ đọc hiểu nâng cao</text>
    <text x="36" y="302" fill="#5F5E5A" font-size="10" style="font-size:10px">Đọc tốt hơn hóa đơn phức tạp,</text>
    <text x="36" y="315" fill="#5F5E5A" font-size="10">cần tải model ~800MB, mặc định tắt</text>
    <rect x="288" y="272" width="36" height="20" rx="10" fill="#E0E0E0"/>
    <circle cx="298" cy="282" r="8" fill="#FFFFFF"/>

    <line x1="36" y1="326" x2="324" y2="326" stroke="#EFEFEF"/>
    <text x="36" y="340" fill="#5F5E5A" font-size="10">Vẫn xử lý hoàn toàn trên máy, không cần mạng sau khi tải model</text>

    <!-- Section: DU LIEU -->
    <text x="20" y="376" fill="#9B9B9B" font-size="10" font-weight="600">DỮ LIỆU</text>
    <rect x="20" y="384" width="320" height="122" rx="10" fill="#FFFFFF" stroke="#EFEFEF"/>

    <text x="36" y="412" fill="#1A1A1A" font-size="13">Ánh xạ Cửa hàng → Danh mục</text>
    <text x="324" y="412" fill="#5F5E5A" font-size="12" text-anchor="end">12 mục</text>
    <path d="M330 408 l6 4 l-6 4" stroke="#B4B2A9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="36" y1="422" x2="324" y2="422" stroke="#EFEFEF"/>

    <text x="36" y="446" fill="#1A1A1A" font-size="13">Lịch sử quét hóa đơn</text>
    <text x="324" y="446" fill="#5F5E5A" font-size="12" text-anchor="end">Xem</text>
    <path d="M330 442 l6 4 l-6 4" stroke="#B4B2A9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="36" y1="456" x2="324" y2="456" stroke="#EFEFEF"/>

    <text x="36" y="480" fill="#D85A30" font-size="13">Xóa dữ liệu học (ánh xạ cửa hàng)</text>

    <!-- privacy note -->
    <rect x="20" y="524" width="320" height="70" rx="10" fill="#E1F5EE"/>
    <circle cx="44" cy="552" r="12" fill="#0F6E56"/>
    <path d="M44 546 v6 M44 556 v1" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="66" y="548" fill="#0F6E56" font-size="11" font-weight="600">Riêng tư tuyệt đối</text>
    <text x="66" y="562" fill="#3D8C77" font-size="10">Ảnh và dữ liệu hóa đơn không rời</text>
    <text x="66" y="574" fill="#3D8C77" font-size="10">khỏi thiết bị của bạn</text>
  </g>
</svg>
