<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame1"><rect x="0" y="0" width="360" height="780" rx="28" ry="28"/></clipPath>
  </defs>
  <rect x="0" y="0" width="360" height="780" rx="28" ry="28" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <g clip-path="url(#frame1)">
    <!-- Background screen (dimmed dashboard behind sheet) -->
    <rect x="0" y="0" width="360" height="780" fill="#FFFFFF"/>
    <rect x="0" y="0" width="360" height="150" fill="#0F6E56"/>
    <text x="24" y="60" fill="#FFFFFF" font-size="12" opacity="0.85">Xin chào,</text>
    <text x="24" y="82" fill="#FFFFFF" font-size="16" font-weight="600">Minh Anh</text>
    <text x="24" y="122" fill="#FFFFFF" font-size="22" font-weight="600">12.480.000 đ</text>
    <text x="24" y="140" fill="#FFFFFF" font-size="11" opacity="0.8">Tổng số dư các ví</text>

    <!-- quick stat cards -->
    <rect x="24" y="170" width="150" height="64" rx="10" fill="#F1EFE8"/>
    <text x="40" y="196" fill="#5F5E5A" font-size="11">Thu tháng này</text>
    <text x="40" y="218" fill="#1A1A1A" font-size="14" font-weight="600">18.000.000 đ</text>
    <rect x="186" y="170" width="150" height="64" rx="10" fill="#F1EFE8"/>
    <text x="202" y="196" fill="#5F5E5A" font-size="11">Chi tháng này</text>
    <text x="202" y="218" fill="#D85A30" font-size="14" font-weight="600">5.520.000 đ</text>

    <!-- transaction list rows (behind, faded) -->
    <g opacity="0.5">
      <text x="24" y="280" fill="#9B9B9B" font-size="9" font-weight="600">HÔM NAY</text>
      <line x1="24" y1="296" x2="336" y2="296" stroke="#EFEFEF"/>
      <text x="24" y="320" fill="#1A1A1A" font-size="13">Ăn trưa - Highlands Coffee</text>
      <text x="336" y="320" fill="#D85A30" font-size="13" text-anchor="end">-85.000 đ</text>
      <line x1="24" y1="336" x2="336" y2="336" stroke="#EFEFEF"/>
      <text x="24" y="360" fill="#1A1A1A" font-size="13">Đổ xăng</text>
      <text x="336" y="360" fill="#D85A30" font-size="13" text-anchor="end">-120.000 đ</text>
    </g>

    <!-- Dim overlay -->
    <rect x="0" y="0" width="360" height="780" fill="#000000" opacity="0.35"/>

    <!-- Bottom sheet -->
    <rect x="0" y="430" width="360" height="350" rx="24" ry="24" fill="#FFFFFF"/>
    <rect x="0" y="454" width="360" height="326" fill="#FFFFFF"/>
    <rect x="160" y="446" width="40" height="4" rx="2" fill="#E0E0E0"/>

    <text x="24" y="486" fill="#1A1A1A" font-size="15" font-weight="600">Thêm giao dịch</text>

    <!-- Option: Thu -->
    <circle cx="46" cy="524" r="20" fill="#E1F5EE"/>
    <path d="M46 516 v16 M39 523 l7 7 l7 -7" stroke="#0F6E56" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="521" fill="#1A1A1A" font-size="13" font-weight="500">Khoản Thu</text>
    <text x="78" y="536" fill="#6B6B6B" font-size="11">Lương, thưởng, thu nhập khác</text>
    <line x1="24" y1="558" x2="336" y2="558" stroke="#EFEFEF"/>

    <!-- Option: Chi -->
    <circle cx="46" cy="586" r="20" fill="#FBE7E0"/>
    <path d="M46 594 v-16 M39 587 l7 -7 l7 7" stroke="#D85A30" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="583" fill="#1A1A1A" font-size="13" font-weight="500">Khoản Chi</text>
    <text x="78" y="598" fill="#6B6B6B" font-size="11">Ăn uống, mua sắm, hóa đơn...</text>
    <line x1="24" y1="620" x2="336" y2="620" stroke="#EFEFEF"/>

    <!-- Option: Chuyen khoan -->
    <circle cx="46" cy="648" r="20" fill="#F1EFE8"/>
    <path d="M38 644 h16 M50 640 l4 4 l-4 4 M54 652 h-16 M42 648 l-4 4 l4 4" stroke="#5F5E5A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="645" fill="#1A1A1A" font-size="13" font-weight="500">Chuyển khoản</text>
    <text x="78" y="660" fill="#6B6B6B" font-size="11">Giữa các ví/tài khoản</text>
    <line x1="24" y1="682" x2="336" y2="682" stroke="#EFEFEF"/>

    <!-- Option: Quet hoa don (highlighted, new AI feature) -->
    <rect x="16" y="694" width="328" height="66" rx="12" fill="#E1F5EE"/>
    <circle cx="46" cy="727" r="20" fill="#0F6E56"/>
    <rect x="37" y="720" width="18" height="13" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="46" cy="726.5" r="4" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <rect x="40" y="717" width="5" height="3" fill="#FFFFFF"/>
    <text x="78" y="723" fill="#0F6E56" font-size="13" font-weight="600">Quét hóa đơn (AI)</text>
    <text x="78" y="738" fill="#3D8C77" font-size="11">Tự động đọc số tiền, ngày, cửa hàng</text>
    <rect x="292" y="702" width="42" height="18" rx="9" fill="#0F6E56"/>
    <text x="313" y="714" fill="#FFFFFF" font-size="8.5" font-weight="600" text-anchor="middle">MỚI</text>
  </g>
</svg>
