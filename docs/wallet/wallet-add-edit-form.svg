<svg viewBox="0 0 320 680" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Màn hình thêm ví mới</title>
<desc>Form tạo ví mới: tên, loại ví dạng chip, số dư ban đầu, tiền tệ, toggle đặt làm mặc định</desc>
<defs><clipPath id="frame2"><rect x="0" y="0" width="320" height="680" rx="26"/></clipPath></defs>
<g clip-path="url(#frame2)">
<rect x="0" y="0" width="320" height="680" fill="#FFFFFF"/>
<rect x="0" y="0" width="320" height="64" fill="#0F6E56"/>
<path d="M28 32 L20 24 L28 16" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="38" font-size="16" font-weight="600" fill="#FFFFFF" font-family="sans-serif">Thêm ví mới</text>

<g font-family="sans-serif">
<text x="20" y="98" font-size="11" fill="#5F5E5A">Tên ví</text>
<rect x="20" y="106" width="280" height="40" rx="8" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="32" y="130" font-size="13" fill="#1A1A1A">Quỹ chi tiêu hàng ngày</text>

<text x="20" y="168" font-size="11" fill="#5F5E5A">Loại ví</text>
<rect x="20" y="176" width="82" height="34" rx="17" fill="#0F6E56"/>
<text x="61" y="197" font-size="11" fill="#FFFFFF" text-anchor="middle">Tiền mặt</text>
<rect x="108" y="176" width="90" height="34" rx="17" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="153" y="197" font-size="11" fill="#1A1A1A" text-anchor="middle">Ngân hàng</text>
<rect x="204" y="176" width="96" height="34" rx="17" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="252" y="197" font-size="11" fill="#1A1A1A" text-anchor="middle">Thẻ tín dụng</text>
<rect x="20" y="216" width="96" height="34" rx="17" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="68" y="237" font-size="11" fill="#1A1A1A" text-anchor="middle">Ví điện tử</text>
<rect x="122" y="216" width="106" height="34" rx="17" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="175" y="237" font-size="11" fill="#1A1A1A" text-anchor="middle">Sổ tiết kiệm</text>

<text x="20" y="278" font-size="11" fill="#5F5E5A">Số dư ban đầu</text>
<rect x="20" y="286" width="184" height="40" rx="8" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="32" y="310" font-size="13" fill="#1A1A1A">3.200.000</text>
<rect x="212" y="286" width="88" height="40" rx="8" fill="#FFFFFF" stroke="#E0E0E0"/>
<text x="256" y="310" font-size="12" fill="#1A1A1A" text-anchor="middle">VND ▾</text>

<text x="20" y="348" font-size="11" fill="#5F5E5A">Biểu tượng &amp; màu sắc</text>
<circle cx="38" cy="376" r="18" fill="#0F6E56"/>
<text x="38" y="381" font-size="14" fill="#FFFFFF" text-anchor="middle">💵</text>
<circle cx="82" cy="376" r="18" fill="#F1EFE8" stroke="#E0E0E0"/>
<text x="82" y="381" font-size="14" text-anchor="middle">🏦</text>
<circle cx="126" cy="376" r="18" fill="#F1EFE8" stroke="#E0E0E0"/>
<text x="126" y="381" font-size="14" text-anchor="middle">💳</text>
<circle cx="170" cy="376" r="18" fill="#F1EFE8" stroke="#E0E0E0"/>
<text x="170" y="381" font-size="14" text-anchor="middle">📱</text>
<circle cx="214" cy="376" r="18" fill="#F1EFE8" stroke="#E0E0E0" stroke-dasharray="3 2"/>
<text x="214" y="381" font-size="12" fill="#9B9B9B" text-anchor="middle">+</text>

<line x1="20" y1="424" x2="300" y2="424" stroke="#EFEFEF"/>
<text x="20" y="454" font-size="13" fill="#1A1A1A">Đặt làm ví mặc định</text>
<rect x="248" y="442" width="40" height="22" rx="11" fill="#0F6E56"/>
<circle cx="277" cy="453" r="9" fill="#FFFFFF"/>
</g>

<rect x="20" y="600" width="280" height="44" rx="8" fill="#0F6E56"/>
<text x="160" y="627" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="sans-serif">Lưu ví</text>
</g>
</svg>
