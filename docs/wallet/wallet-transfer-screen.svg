<svg viewBox="0 0 320 680" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Màn hình chuyển tiền giữa ví</title>
<desc>Form chuyển tiền nội bộ: ví nguồn, ví đích, số tiền, ngày giờ, ghi chú và nút xác nhận</desc>
<defs><clipPath id="frame4"><rect x="0" y="0" width="320" height="680" rx="26"/></clipPath></defs>
<g clip-path="url(#frame4)">
<rect x="0" y="0" width="320" height="680" fill="#FFFFFF"/>
<rect x="0" y="0" width="320" height="64" fill="#0F6E56"/>
<path d="M28 32 L20 24 L28 16" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="38" font-size="16" font-weight="600" fill="#FFFFFF" font-family="sans-serif">Chuyển tiền giữa ví</text>

