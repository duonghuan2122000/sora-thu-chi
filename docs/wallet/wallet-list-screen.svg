<text x="66" y="350" font-size="13" font-weight="600" fill="#1A1A1A">Thẻ tín dụng VIB</text>
<text x="66" y="365" font-size="11" fill="#D85A30">Đã dùng 6.500.000 / 20.000.000 đ</text>
<text x="284" y="354" font-size="13" font-weight="600" fill="#D85A30" text-anchor="end">32%</text>
<line x1="20" y1="384" x2="300" y2="384" stroke="#EFEFEF" stroke-width="1"/>

<circle cx="38" cy="414" r="18" fill="#E1F5EE"/>
<text x="38" y="419" font-size="14" fill="#0F6E56" text-anchor="middle">📱</text>
