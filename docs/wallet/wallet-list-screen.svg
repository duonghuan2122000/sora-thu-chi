<rect x="20" y="600" width="280" height="44" rx="8" fill="#0F6E56"/>
<text x="160" y="627" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="sans-serif">+ Thêm ví mới</text>
