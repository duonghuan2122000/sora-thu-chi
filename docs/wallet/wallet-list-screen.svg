<text x="36" y="160" font-size="11" fill="#9B9B9B" font-family="sans-serif">5 ví đang hoạt động</text>

<text x="20" y="192" font-size="10" letter-spacing="0.5" fill="#9B9B9B" font-family="sans-serif">VÍ CỦA BẠN</text>

<g font-family="sans-serif">
<line x1="20" y1="204" x2="300" y2="204" stroke="#EFEFEF" stroke-width="1"/>
