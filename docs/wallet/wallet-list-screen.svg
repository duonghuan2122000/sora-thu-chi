<text x="66" y="245" font-size="11" fill="#5F5E5A">Mặc định</text>
<text x="284" y="234" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="end">3.200.000 đ</text>
<line x1="20" y1="264" x2="300" y2="264" stroke="#EFEFEF" stroke-width="1"/>

<circle cx="38" cy="294" r="18" fill="#E1F5EE"/>
<text x="38" y="299" font-size="14" fill="#0F6E56" text-anchor="middle">🏦</text>
<text x="66" y="290" font-size="13" font-weight="600" fill="#1A1A1A">Vietcombank</text>
<text x="66" y="305" font-size="11" fill="#5F5E5A">Tài khoản ngân hàng</text>
<text x="284" y="294" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="end">14.800.000 đ</text>
<line x1="20" y1="324" x2="300" y2="324" stroke="#EFEFEF" stroke-width="1"/>

