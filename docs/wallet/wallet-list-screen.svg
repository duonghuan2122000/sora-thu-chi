<svg viewBox="0 0 320 680" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Màn hình danh sách ví</title>
<desc>Sub-page quản lý ví với app bar teal, card tổng số dư và danh sách các ví dạng ListTile</desc>
<defs>
<clipPath id="frame1"><rect x="0" y="0" width="320" height="680" rx="26"/></clipPath>
</defs>
<g clip-path="url(#frame1)">
<rect x="0" y="0" width="320" height="680" fill="#FFFFFF"/>
<rect x="0" y="0" width="320" height="64" fill="#0F6E56"/>
<path d="M28 32 L20 24 L28 16" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="38" font-size="16" font-weight="600" fill="#FFFFFF" font-family="sans-serif">Quản lý ví</text>

<rect x="20" y="84" width="280" height="86" rx="10" fill="#F1EFE8"/>
<text x="36" y="112" font-size="11" fill="#6B6B6B" font-family="sans-serif">TỔNG SỐ DƯ TẤT CẢ VÍ</text>
