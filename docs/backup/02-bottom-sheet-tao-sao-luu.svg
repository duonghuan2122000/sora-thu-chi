<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame2"><rect width="360" height="780" rx="28"/></clipPath>
  </defs>
  <rect width="360" height="780" rx="28" fill="#E0E0E0"/>
  <g clip-path="url(#frame2)">
    <!-- Background screen (dimmed) -->
    <rect width="360" height="780" fill="#FFFFFF"/>
    <rect width="360" height="56" fill="#0F6E56"/>
    <text x="44" y="33" font-size="16" font-weight="600" fill="#FFFFFF">Sao lưu &amp; Khôi phục</text>
    <rect width="360" height="780" fill="#1A1A1A" opacity="0.45"/>

    <!-- Bottom sheet -->
    <rect x="0" y="360" width="360" height="480" rx="20" fill="#FFFFFF"/>
    <rect x="160" y="378" width="40" height="4" rx="2" fill="#E0E0E0"/>

    <text x="24" y="416" font-size="16" font-weight="600" fill="#1A1A1A">Tạo bản sao lưu</text>
    <text x="24" y="434" font-size="11" fill="#6B6B6B">Xem lại nội dung trước khi tạo file</text>
    <line x1="24" y1="448" x2="336" y2="448" stroke="#EFEFEF" stroke-width="1"/>

    <!-- Stat rows -->
    <text x="24" y="474" font-size="13" fill="#5F5E5A">Ví</text>
    <text x="336" y="474" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="end">4</text>
    <line x1="24" y1="486" x2="336" y2="486" stroke="#EFEFEF" stroke-width="1"/>

    <text x="24" y="510" font-size="13" fill="#5F5E5A">Danh mục</text>
    <text x="336" y="510" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="end">18</text>
    <line x1="24" y1="522" x2="336" y2="522" stroke="#EFEFEF" stroke-width="1"/>

    <text x="24" y="546" font-size="13" fill="#5F5E5A">Giao dịch</text>
    <text x="336" y="546" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="end">342</text>
    <line x1="24" y1="558" x2="336" y2="558" stroke="#EFEFEF" stroke-width="1"/>

    <text x="24" y="582" font-size="13" fill="#5F5E5A">Kích thước ước tính</text>
    <text x="336" y="582" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="end">1.8 MB</text>
    <line x1="24" y1="594" x2="336" y2="594" stroke="#EFEFEF" stroke-width="1"/>

    <!-- Password toggle row -->
    <text x="24" y="620" font-size="13" font-weight="600" fill="#1A1A1A">Đặt mật khẩu bảo vệ file</text>
    <text x="24" y="636" font-size="11" fill="#6B6B6B">Khuyến nghị nếu chia sẻ qua email/cloud</text>
    <rect x="296" y="612" width="36" height="20" rx="10" fill="#E0E0E0"/>
    <circle cx="306" cy="622" r="8" fill="#FFFFFF"/>

    <!-- Buttons -->
    <rect x="24" y="700" width="148" height="44" rx="8" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="98" y="727" font-size="14" font-weight="600" fill="#1A1A1A" text-anchor="middle">Hủy</text>

    <rect x="188" y="700" width="148" height="44" rx="8" fill="#0F6E56"/>
    <text x="262" y="727" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tạo &amp; Chia sẻ</text>
  </g>
</svg>
