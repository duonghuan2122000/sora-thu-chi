<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .title-white{fill:#FFFFFF;font-size:16px;font-weight:600;}
    .label-white{fill:#FFFFFF;fill-opacity:0.85;font-size:11px;}
    .value-white{fill:#FFFFFF;font-size:18px;font-weight:600;}
    .seg-active{fill:#0F6E56;font-size:12px;font-weight:600;}
    .seg-inactive{fill:#FFFFFF;fill-opacity:0.85;font-size:12px;}
    .card-title{fill:#1A1A1A;font-size:13px;font-weight:600;}
    .legend-text{fill:#5F5E5A;font-size:11px;}
    .axis-label{fill:#9B9B9B;font-size:9px;}
    .cat-name{fill:#1A1A1A;font-size:13px;font-weight:400;}
    .cat-amount{fill:#1A1A1A;font-size:13px;font-weight:600;}
    .pct{fill:#5F5E5A;font-size:11px;}
    .nav-label{fill:#9B9B9B;font-size:9px;}
    .nav-label-active{fill:#0F6E56;font-size:9px;font-weight:600;}
  </style>

  <!-- phone frame -->
  <rect x="1" y="1" width="358" height="778" rx="28" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>

  <!-- header -->
  <path d="M1,29 Q1,1 29,1 L331,1 Q359,1 359,29 L359,190 L1,190 Z" fill="#0F6E56"/>
  <text x="24" y="44" class="title-white">Báo cáo</text>
  <!-- calendar icon button -->
  <rect x="312" y="26" width="28" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.15"/>
  <rect x="318" y="34" width="16" height="13" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  <line x1="321" y1="31" x2="321" y2="35" stroke="#FFFFFF" stroke-width="1.4"/>
  <line x1="331" y1="31" x2="331" y2="35" stroke="#FFFFFF" stroke-width="1.4"/>

  <!-- segmented control -->
  <rect x="20" y="64" width="320" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.15"/>
  <rect x="182" y="67" width="76" height="28" rx="14" fill="#FFFFFF"/>
  <text x="60" y="85" text-anchor="middle" class="seg-inactive">Ngày</text>
  <text x="140" y="85" text-anchor="middle" class="seg-inactive">Tuần</text>
  <text x="220" y="85" text-anchor="middle" class="seg-active">Tháng</text>
  <text x="300" y="85" text-anchor="middle" class="seg-inactive">Năm</text>

  <!-- summary row -->
  <path d="M104,127 l-4,7 l8,0 Z" fill="#FFFFFF"/>
  <text x="60" y="133" class="label-white">Tổng thu</text>
  <text x="42" y="157" class="value-white">18.500.000 đ</text>

  <line x1="180" y1="122" x2="180" y2="168" stroke="#FFFFFF" stroke-opacity="0.25"/>

  <path d="M244,127 l-4,-7 l8,0 Z" fill="#FFFFFF"/>
  <text x="202" y="133" class="label-white">Tổng chi</text>
  <text x="192" y="157" class="value-white">12.300.000 đ</text>

  <!-- CARD 1: bar chart thu/chi theo tháng -->
  <rect x="20" y="206" width="320" height="176" rx="10" fill="#FFFFFF" stroke="#EFEFEF"/>
  <text x="36" y="228" class="card-title">Dòng tiền 6 tháng gần đây</text>
  <circle cx="234" cy="224" r="4" fill="#0F6E56"/>
  <text x="242" y="228" class="legend-text">Thu</text>
  <circle cx="280" cy="224" r="4" fill="#D85A30"/>
  <text x="288" y="228" class="legend-text">Chi</text>

  <line x1="36" y1="350" x2="324" y2="350" stroke="#EFEFEF"/>
  <!-- month groups: income (teal) / expense (coral) -->
  <g>
    <rect x="41" y="300" width="9" height="50" rx="2" fill="#0F6E56"/>
    <rect x="52" y="318" width="9" height="32" rx="2" fill="#D85A30"/>
    <text x="51" y="364" text-anchor="middle" class="axis-label">T4</text>

    <rect x="89" y="286" width="9" height="64" rx="2" fill="#0F6E56"/>
    <rect x="100" y="310" width="9" height="40" rx="2" fill="#D85A30"/>
    <text x="99" y="364" text-anchor="middle" class="axis-label">T5</text>

    <rect x="137" y="292" width="9" height="58" rx="2" fill="#0F6E56"/>
    <rect x="148" y="296" width="9" height="54" rx="2" fill="#D85A30"/>
    <text x="147" y="364" text-anchor="middle" class="axis-label">T6</text>

    <rect x="185" y="270" width="9" height="80" rx="2" fill="#0F6E56"/>
    <rect x="196" y="322" width="9" height="28" rx="2" fill="#D85A30"/>
    <text x="195" y="364" text-anchor="middle" class="axis-label">T7</text>

    <rect x="233" y="280" width="9" height="70" rx="2" fill="#0F6E56"/>
    <rect x="244" y="304" width="9" height="46" rx="2" fill="#D85A30"/>
    <text x="243" y="364" text-anchor="middle" class="axis-label">T8</text>

    <rect x="281" y="260" width="9" height="90" rx="2" fill="#0F6E56"/>
    <rect x="292" y="290" width="9" height="60" rx="2" fill="#D85A30"/>
    <text x="291" y="364" text-anchor="middle" class="axis-label">T9</text>
  </g>

  <!-- CARD 2: donut chart phân bổ danh mục -->
  <rect x="20" y="396" width="320" height="170" rx="10" fill="#FFFFFF" stroke="#EFEFEF"/>
  <text x="36" y="418" class="card-title">Phân bổ chi tiêu theo danh mục</text>

  <g transform="rotate(-90 95 490)">
    <circle cx="95" cy="490" r="55" fill="none" stroke="#0F6E56" stroke-width="20" stroke-dasharray="110.6 234.9" stroke-dashoffset="0"/>
    <circle cx="95" cy="490" r="55" fill="none" stroke="#3D8C77" stroke-width="20" stroke-dasharray="82.9 262.6" stroke-dashoffset="-110.6"/>
    <circle cx="95" cy="490" r="55" fill="none" stroke="#E3B341" stroke-width="20" stroke-dasharray="62.2 283.3" stroke-dashoffset="-193.5"/>
    <circle cx="95" cy="490" r="55" fill="none" stroke="#6B7FD7" stroke-width="20" stroke-dasharray="48.4 297.1" stroke-dashoffset="-255.7"/>
    <circle cx="95" cy="490" r="55" fill="none" stroke="#B4B2A9" stroke-width="20" stroke-dasharray="41.5 304.0" stroke-dashoffset="-304.1"/>
  </g>
  <text x="95" y="486" text-anchor="middle" class="pct" font-size="10">Tổng chi</text>
  <text x="95" y="500" text-anchor="middle" class="cat-amount" font-size="12">12.300.000đ</text>

  <g>
    <circle cx="176" cy="450" r="4" fill="#0F6E56"/>
    <text x="186" y="454" class="legend-text">Ăn uống</text>
    <text x="330" y="454" text-anchor="end" class="pct">32%</text>

    <circle cx="176" cy="472" r="4" fill="#3D8C77"/>
    <text x="186" y="476" class="legend-text">Nhà ở</text>
    <text x="330" y="476" text-anchor="end" class="pct">24%</text>

    <circle cx="176" cy="494" r="4" fill="#E3B341"/>
    <text x="186" y="498" class="legend-text">Di chuyển</text>
    <text x="330" y="498" text-anchor="end" class="pct">18%</text>

    <circle cx="176" cy="516" r="4" fill="#6B7FD7"/>
    <text x="186" y="520" class="legend-text">Mua sắm</text>
    <text x="330" y="520" text-anchor="end" class="pct">14%</text>

    <circle cx="176" cy="538" r="4" fill="#B4B2A9"/>
    <text x="186" y="542" class="legend-text">Khác</text>
    <text x="330" y="542" text-anchor="end" class="pct">12%</text>
  </g>

  <!-- CARD 3: top danh mục -->
  <rect x="20" y="578" width="320" height="132" rx="10" fill="#FFFFFF" stroke="#EFEFEF"/>
  <text x="36" y="598" class="card-title">Top danh mục chi tiêu</text>

  <g>
    <circle cx="48" cy="618" r="12" fill="#E1F5EE"/>
    <path d="M43,618 h10 M48,613 v10" stroke="#0F6E56" stroke-width="1.6"/>
    <text x="68" y="616" class="cat-name">Ăn uống</text>
    <text x="324" y="616" text-anchor="end" class="cat-amount">3.940.000 đ</text>
    <rect x="68" y="624" width="256" height="4" rx="2" fill="#EFEFEF"/>
    <rect x="68" y="624" width="82" height="4" rx="2" fill="#0F6E56"/>
  </g>
  <g>
    <circle cx="48" cy="654" r="12" fill="#E1F5EE"/>
    <path d="M43,654 h10 M48,649 v10" stroke="#3D8C77" stroke-width="1.6"/>
    <text x="68" y="652" class="cat-name">Nhà ở</text>
    <text x="324" y="652" text-anchor="end" class="cat-amount">2.950.000 đ</text>
    <rect x="68" y="660" width="256" height="4" rx="2" fill="#EFEFEF"/>
    <rect x="68" y="660" width="61" height="4" rx="2" fill="#3D8C77"/>
  </g>
  <g>
    <circle cx="48" cy="690" r="12" fill="#E1F5EE"/>
    <path d="M43,690 h10 M48,685 v10" stroke="#E3B341" stroke-width="1.6"/>
    <text x="68" y="688" class="cat-name">Di chuyển</text>
    <text x="324" y="688" text-anchor="end" class="cat-amount">2.215.000 đ</text>
    <rect x="68" y="696" width="256" height="4" rx="2" fill="#EFEFEF"/>
    <rect x="68" y="696" width="46" height="4" rx="2" fill="#E3B341"/>
  </g>

  <!-- bottom nav -->
  <line x1="1" y1="716" x2="359" y2="716" stroke="#EFEFEF"/>
  <path d="M1,716 L359,716 L359,751 Q359,779 331,779 L29,779 Q1,779 1,751 Z" fill="#FFFFFF"/>

  <!-- tab: Tổng quan -->
  <path d="M70,730 l-8,7 v9 h16 v-9 Z" fill="none" stroke="#9B9B9B" stroke-width="1.6"/>
  <text x="70" y="756" text-anchor="middle" class="nav-label">Tổng quan</text>

  <!-- tab: Giao dịch -->
  <line x1="132" y1="732" x2="148" y2="732" stroke="#9B9B9B" stroke-width="1.6"/>
  <line x1="132" y1="737" x2="148" y2="737" stroke="#9B9B9B" stroke-width="1.6"/>
  <line x1="132" y1="742" x2="148" y2="742" stroke="#9B9B9B" stroke-width="1.6"/>
  <text x="140" y="756" text-anchor="middle" class="nav-label">Giao dịch</text>

  <!-- FAB -->
  <circle cx="180" cy="706" r="28" fill="#0F6E56"/>
  <line x1="171" y1="706" x2="189" y2="706" stroke="#FFFFFF" stroke-width="2.4"/>
  <line x1="180" y1="697" x2="180" y2="715" stroke="#FFFFFF" stroke-width="2.4"/>

  <!-- tab: Báo cáo (active) -->
  <path d="M212,742 a8,8 0 1 1 16,0 Z" fill="#0F6E56"/>
  <path d="M220,734 v8 h8" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="220" y="756" text-anchor="middle" class="nav-label-active">Báo cáo</text>

  <!-- tab: Cài đặt -->
  <circle cx="290" cy="737" r="7" fill="none" stroke="#9B9B9B" stroke-width="1.6"/>
  <circle cx="290" cy="737" r="2.4" fill="#9B9B9B"/>
  <text x="290" y="756" text-anchor="middle" class="nav-label">Cài đặt</text>
</svg>
