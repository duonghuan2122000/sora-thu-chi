<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .title-white{fill:#FFFFFF;font-size:16px;font-weight:600;}
    .card-title{fill:#1A1A1A;font-size:13px;font-weight:600;}
    .chip-text{fill:#1A1A1A;font-size:12px;font-weight:600;}
    .legend-text{fill:#5F5E5A;font-size:11px;}
    .axis-label{fill:#9B9B9B;font-size:9px;}
    .stat-label{fill:#5F5E5A;font-size:11px;}
    .stat-value{fill:#1A1A1A;font-size:18px;font-weight:600;}
    .badge-bad{fill:#D85A30;font-size:11px;font-weight:600;}
    .badge-good{fill:#0F6E56;font-size:11px;font-weight:600;}
    .insight-text{fill:#1A1A1A;font-size:12px;}
  </style>

  <rect x="1" y="1" width="358" height="778" rx="28" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>

  <!-- app bar -->
  <path d="M1,29 Q1,1 29,1 L331,1 Q359,1 359,29 L359,88 L1,88 Z" fill="#0F6E56"/>
  <path d="M32,44 l-8,8 l8,8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="52" y="58" class="title-white">So sánh kỳ</text>

  <!-- period chips -->
  <rect x="20" y="102" width="140" height="34" rx="17" fill="#0F6E56"/>
  <text x="90" y="124" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Tháng 9/2026</text>

  <circle cx="180" cy="119" r="14" fill="#F1EFE8"/>
  <path d="M174,115 h12 M182,111 l4,4 l-4,4 M186,123 h-12 M178,127 l-4,-4 l4,-4" stroke="#5F5E5A" stroke-width="1.3" fill="none"/>

  <rect x="200" y="102" width="140" height="34" rx="17" fill="#F1EFE8"/>
  <text x="270" y="124" text-anchor="middle" fill="#5F5E5A" font-size="12" font-weight="600">Tháng 8/2026</text>

  <!-- card: Thu nhap -->
  <rect x="20" y="154" width="320" height="110" rx="10" fill="#FFFFFF" stroke="#EFEFEF"/>
  <text x="36" y="176" class="card-title">Thu nhập</text>
  <text x="304" y="176" text-anchor="end" class="badge-good">▲ 8%</text>

  <rect x="60" y="200" width="36" height="46" rx="3" fill="#B4B2A9" fill-opacity="0.5"/>
  <text x="78" y="256" text-anchor="middle" class="axis-label">T8</text>
  <rect x="120" y="188" width="36" height="58" rx="3" fill="#0F6E56"/>
  <text x="138" y="256" text-anchor="middle" class="axis-label">T9</text>

  <text x="230" y="212" class="stat-label">T8: 17.100.000 đ</text>
  <text x="230" y="232" class="stat-value" font-size="14">T9: 18.500.000 đ</text>

  <!-- card: Chi tieu -->
  <rect x="20" y="276" width="320" height="110" rx="10" fill="#FFFFFF" stroke="#EFEFEF"/>
  <text x="36" y="298" class="card-title">Chi tiêu</text>
  <text x="304" y="298" text-anchor="end" class="badge-bad">▲ 15%</text>

  <rect x="60" y="322" width="36" height="36" rx="3" fill="#B4B2A9" fill-opacity="0.5"/>
  <text x="78" y="378" text-anchor="middle" class="axis-label">T8</text>
  <rect x="120" y="300" width="36" height="58" rx="3" fill="#D85A30"/>
  <text x="138" y="378" text-anchor="middle" class="axis-label">T9</text>

  <text x="230" y="334" class="stat-label">T8: 10.700.000 đ</text>
  <text x="230" y="354" class="stat-value" font-size="14">T9: 12.300.000 đ</text>

  <!-- card: line chart xu huong so sanh -->
  <rect x="20" y="398" width="320" height="180" rx="10" fill="#FFFFFF" stroke="#EFEFEF"/>
  <text x="36" y="420" class="card-title">Xu hướng chi tiêu theo ngày</text>
  <line x1="240" y1="416" x2="256" y2="416" stroke="#0F6E56" stroke-width="2"/>
  <text x="262" y="420" class="legend-text">T9</text>
  <line x1="290" y1="416" x2="306" y2="416" stroke="#9B9B9B" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="312" y="420" class="legend-text">T8</text>

  <line x1="36" y1="540" x2="324" y2="540" stroke="#EFEFEF"/>
  <polyline points="40,520 90,500 140,510 190,470 240,486 290,450 320,460" fill="none" stroke="#9B9B9B" stroke-width="2" stroke-dasharray="4 3"/>
  <polyline points="40,510 90,486 140,494 190,440 240,458 290,410 320,430" fill="none" stroke="#0F6E56" stroke-width="2.4"/>
  <text x="40" y="554" class="axis-label">1</text>
  <text x="180" y="554" text-anchor="middle" class="axis-label">15</text>
  <text x="320" y="554" text-anchor="end" class="axis-label">30</text>

  <!-- insight card -->
  <rect x="20" y="596" width="320" height="70" rx="10" fill="#FFF3EE"/>
  <circle cx="46" cy="631" r="14" fill="#F3D9CC"/>
  <path d="M46,624 v10 M46,637 v0.5" stroke="#D85A30" stroke-width="2"/>
  <text x="70" y="623" class="insight-text" font-weight="600">Nhận xét</text>
  <text x="70" y="641" class="insight-text">Bạn chi nhiều hơn kỳ trước 15%, chủ yếu</text>
  <text x="70" y="656" class="insight-text">do danh mục Ăn uống tăng mạnh.</text>
</svg>
