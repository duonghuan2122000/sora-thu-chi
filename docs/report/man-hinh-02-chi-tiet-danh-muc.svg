    <text x="336" y="423" text-anchor="end" class="cat-amount">2.950.000 đ</text>
    <text x="336" y="438" text-anchor="end" class="pct">24%</text>
    <rect x="64" y="432" width="256" height="4" rx="2" fill="#EFEFEF"/>
    <rect x="64" y="432" width="61" height="4" rx="2" fill="#3D8C77"/>
  </g>
  <line x1="20" y1="456" x2="340" y2="456" stroke="#EFEFEF"/>

  <g>
    <circle cx="40" cy="478" r="12" fill="#E3B341"/>
    <text x="64" y="475" class="cat-name">Di chuyển</text>
    <text x="336" y="475" text-anchor="end" class="cat-amount">2.215.000 đ</text>
    <text x="336" y="490" text-anchor="end" class="pct">18%</text>
    <rect x="64" y="484" width="256" height="4" rx="2" fill="#EFEFEF"/>
    <rect x="64" y="484" width="46" height="4" rx="2" fill="#E3B341"/>
  </g>
  <line x1="20" y1="508" x2="340" y2="508" stroke="#EFEFEF"/>

  <g>
    <circle cx="40" cy="530" r="12" fill="#6B7FD7"/>
    <text x="64" y="527" class="cat-name">Mua sắm</text>
    <text x="336" y="527" text-anchor="end" class="cat-amount">1.722.000 đ</text>
    <text x="336" y="542" text-anchor="end" class="pct">14%</text>
    <rect x="64" y="536" width="256" height="4" rx="2" fill="#EFEFEF"/>
    <rect x="64" y="536" width="36" height="4" rx="2" fill="#6B7FD7"/>
  </g>
  <line x1="20" y1="560" x2="340" y2="560" stroke="#EFEFEF"/>

  <g>
    <circle cx="40" cy="582" r="12" fill="#C97B84"/>
    <text x="64" y="579" class="cat-name">Giải trí</text>
    <text x="336" y="579" text-anchor="end" class="cat-amount">861.000 đ</text>
    <text x="336" y="594" text-anchor="end" class="pct">7%</text>
    <rect x="64" y="588" width="256" height="4" rx="2" fill="#EFEFEF"/>
    <rect x="64" y="588" width="18" height="4" rx="2" fill="#C97B84"/>
  </g>
  <line x1="20" y1="612" x2="340" y2="612" stroke="#EFEFEF"/>

  <g>
    <circle cx="40" cy="634" r="12" fill="#B4B2A9"/>
    <text x="64" y="631" class="cat-name">Khác</text>
    <text x="336" y="631" text-anchor="end" class="cat-amount">615.000 đ</text>
    <text x="336" y="646" text-anchor="end" class="pct">5%</text>
    <rect x="64" y="640" width="256" height="4" rx="2" fill="#EFEFEF"/>
    <rect x="64" y="640" width="13" height="4" rx="2" fill="#B4B2A9"/>
