<svg viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .title-white{fill:#FFFFFF;font-size:16px;font-weight:600;}
    .card-title{fill:#1A1A1A;font-size:13px;font-weight:600;}
    .cat-name{fill:#1A1A1A;font-size:13px;}
    .cat-amount{fill:#1A1A1A;font-size:13px;font-weight:600;}
    .pct{fill:#5F5E5A;font-size:11px;}
    .section-header{fill:#9B9B9B;font-size:10px;font-weight:600;}
    .period-text{fill:#1A1A1A;font-size:13px;font-weight:600;}
  </style>

  <rect x="1" y="1" width="358" height="778" rx="28" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>

  <!-- app bar -->
  <path d="M1,29 Q1,1 29,1 L331,1 Q359,1 359,29 L359,88 L1,88 Z" fill="#0F6E56"/>
  <path d="M32,44 l-8,8 l8,8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="52" y="58" class="title-white">Chi tiêu theo danh mục</text>

  <!-- period selector -->
  <rect x="130" y="102" width="100" height="30" rx="15" fill="#F1EFE8"/>
  <text x="150" y="121" class="period-text">Tháng 9/2026</text>
  <path d="M212,116 l4,4 l4,-4" fill="none" stroke="#5F5E5A" stroke-width="1.6"/>

  <!-- donut chart -->
  <g transform="rotate(-90 180 230)">
    <circle cx="180" cy="230" r="70" fill="none" stroke="#0F6E56" stroke-width="26" stroke-dasharray="140.7 299.1" stroke-dashoffset="0"/>
    <circle cx="180" cy="230" r="70" fill="none" stroke="#3D8C77" stroke-width="26" stroke-dasharray="105.5 334.3" stroke-dashoffset="-140.7"/>
    <circle cx="180" cy="230" r="70" fill="none" stroke="#E3B341" stroke-width="26" stroke-dasharray="79.2 360.7" stroke-dashoffset="-246.2"/>
    <circle cx="180" cy="230" r="70" fill="none" stroke="#6B7FD7" stroke-width="26" stroke-dasharray="61.6 378.3" stroke-dashoffset="-325.4"/>
    <circle cx="180" cy="230" r="70" fill="none" stroke="#C97B84" stroke-width="26" stroke-dasharray="35.2 404.7" stroke-dashoffset="-387.0"/>
    <circle cx="180" cy="230" r="70" fill="none" stroke="#B4B2A9" stroke-width="26" stroke-dasharray="17.6 422.3" stroke-dashoffset="-422.2"/>
  </g>
  <text x="180" y="222" text-anchor="middle" class="pct" font-size="11">Tổng chi tháng</text>
  <text x="180" y="242" text-anchor="middle" class="cat-amount" font-size="17">12.300.000 đ</text>

  <line x1="20" y1="326" x2="340" y2="326" stroke="#EFEFEF"/>
  <text x="24" y="346" class="section-header">DANH MỤC (6)</text>

  <!-- list rows -->
  <g>
    <circle cx="40" cy="374" r="12" fill="#0F6E56"/>
    <text x="64" y="371" class="cat-name">Ăn uống</text>
    <text x="336" y="371" text-anchor="end" class="cat-amount">3.940.000 đ</text>
    <text x="336" y="386" text-anchor="end" class="pct">32%</text>
    <rect x="64" y="380" width="256" height="4" rx="2" fill="#EFEFEF"/>
    <rect x="64" y="380" width="82" height="4" rx="2" fill="#0F6E56"/>
  </g>
  <line x1="20" y1="404" x2="340" y2="404" stroke="#EFEFEF"/>

  <g>
    <circle cx="40" cy="426" r="12" fill="#3D8C77"/>
